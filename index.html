<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Compare simulated daily temperatures for six Turkish cities, with analytics and city profiles. A SEDS 513 human-computer interaction teaching prototype." />
    <title>Scientific Time-Series Explorer · SEDS 513</title>
    <script>
      // Apply the stored or system theme before first paint; failure is harmless.
      try {
        var stored = localStorage.getItem('stse-theme')
        if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
